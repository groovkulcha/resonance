<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Resonance Member Pass</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0d0e; --card: #19191c; --ink: #f8f4ec; --muted: #bbb7ae; --accent: #f5c842; --line: #34343a; --danger: #ff7878; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #2c2110, transparent 38%), var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 430px); }
    .brand { margin: 0 0 12px; font-size: .78rem; font-weight: 800; letter-spacing: .2em; text-align: center; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0 0 22px; font-size: clamp(2rem, 8vw, 3.1rem); line-height: .95; letter-spacing: -.055em; text-align: center; }
    .pass { overflow: hidden; border: 1px solid var(--line); border-radius: 26px; background: linear-gradient(135deg, #242329, var(--card) 52%, #141416); box-shadow: 0 20px 60px #0008; }
    .pass-top { padding: 28px 26px 24px; border-bottom: 1px dashed #58565d; }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .name { margin: 0; font-size: 1.7rem; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
    .status { display: inline-flex; gap: 7px; align-items: center; margin-top: 15px; padding: 7px 10px; border: 1px solid #5b5125; border-radius: 999px; color: #ffe28a; background: #312a12; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px var(--accent); }
    .pass-body { padding: 27px 26px 30px; text-align: center; }
    #qr { display: grid; width: min(100%, 276px); min-height: 276px; margin: 0 auto 22px; place-items: center; padding: 12px; border-radius: 16px; background: #fff; }
    #qr canvas, #qr img { display: block; max-width: 100%; height: auto; }
    .code-label { margin: 0 0 5px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .code { margin: 0; font: 800 1.2rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .16em; }
    .note { margin: 22px 0 0; color: var(--muted); font-size: .86rem; line-height: 1.5; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    button, a.button { appearance: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); background: #25252a; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    button:hover, a.button:hover { border-color: var(--accent); }
    .message { margin: 18px 4px 0; color: var(--muted); font-size: .9rem; line-height: 1.5; text-align: center; }
    .message.error { color: var(--danger); }
    .hidden { display: none !important; }
    @media print { body { display: block; padding: 0; background: #fff; color: #111; } main { margin: 0 auto; } .brand, h1, .actions, .message { display: none; } .pass { border: 1px solid #aaa; box-shadow: none; background: #fff; } .pass-top { border-color: #aaa; } .eyebrow, .note { color: #555; } .status { color: #554000; background: #fff9d9; border-color: #aa8c00; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">Resonance</p>
    <h1>Your member pass</h1>
    <section id="pass" class="pass hidden" aria-live="polite">
      <div class="pass-top">
        <p class="eyebrow">Permanent entry pass</p>
        <p id="member-name" class="name">Member</p>
        <span class="status"><span class="dot"></span> Active</span>
      </div>
      <div class="pass-body">
        <div id="qr" aria-label="Your member QR code"></div>
        <p class="code-label">Member code</p>
        <p id="member-code" class="code"></p>
        <p class="note">Show this QR code at Resonance events. It contains a private pass token, not your personal details.</p>
        <div class="actions">
          <button type="button" id="print">Print / save</button>
          <button type="button" id="sign-out">Sign out</button>
        </div>
      </div>
    </section>
    <p id="message" class="message">Checking your member pass…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const supabaseUrl = 'https://bawttitvhoiwsjjxjmae.supabase.co';
    const supabaseKey = 'sb_publishable_iygmt6kTFDohEVviH5QcbA_hxrLRDXR';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
      auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
    });
    const message = document.getElementById('message');
    const pass = document.getElementById('pass');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
      message.classList.remove('hidden');
    }

    function clearCallbackFromUrl() {
      if (window.location.search.includes('code=') || window.location.hash.includes('access_token=')) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function renderPass(profile, memberPass) {
      document.getElementById('member-name').textContent = profile.display_name || 'Resonance member';
      document.getElementById('member-code').textContent = profile.member_code || '—';
      const qr = document.getElementById('qr');
      qr.replaceChildren();
      new QRCode(qr, {
        text: memberPass.pass_token,
        width: 252,
        height: 252,
        colorDark: '#111111',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      pass.classList.remove('hidden');
      message.classList.add('hidden');
    }

    async function getCallbackSession() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get('code');

      if (code) {
        showMessage('Signing you in…');
        const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) throw error;
        clearCallbackFromUrl();
        return data.session;
      }

      showMessage('Processing your secure sign-in…');

      return new Promise((resolve, reject) => {
        let settled = false;
        let timer = null;
        let interval = null;
        let subscription = null;

        const finish = (error, session) => {
          if (settled) return;
          settled = true;

          if (timer) window.clearTimeout(timer);
          if (interval) window.clearInterval(interval);
          if (subscription) subscription.unsubscribe();

          if (error) {
            reject(error);
            return;
          }

          clearCallbackFromUrl();
          resolve(session);
        };

        const checkSession = async () => {
          try {
            const { data, error } = await supabaseClient.auth.getSession();
            if (error) return finish(error);
            if (data.session) return finish(null, data.session);
          } catch (error) {
            finish(error);
          }
        };

        const { data } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' && session) {
            finish(null, session);
          }
        });

        subscription = data.subscription;
        checkSession();
        interval = window.setInterval(checkSession, 250);

        timer = window.setTimeout(() => {
          finish(
            new Error(
              'Secure sign-in was not completed. Please request a new sign-in link and open it in the same browser.'
            )
          );
        }, 10000);
      });
    }

    async function loadPass() {
      try {
        const session = await getCallbackSession();
        if (!session) {
          throw new Error('Please sign in through the Resonance member portal before opening your pass.');
        }

        showMessage('Loading your member pass…');
        const [profileResult, passResult] = await Promise.all([
          supabaseClient.from('profiles').select('display_name, member_code').eq('id', session.user.id).single(),
          supabaseClient.from('member_passes').select('pass_token, status').eq('profile_id', session.user.id).eq('status', 'active').single()
        ]);

        if (profileResult.error || passResult.error) {
          const detail = profileResult.error?.message || passResult.error?.message || 'The pass record was not found.';
          throw new Error(`Your active pass could not be loaded: ${detail}`);
        }

        renderPass(profileResult.data, passResult.data);
      } catch (error) {
        console.error('Member pass loading failed:', error);
        showMessage(error?.message || 'Your member pass could not be loaded. Please request a new sign-in link and try again.', true);
      }
    }

    document.getElementById('print').addEventListener('click', () => window.print());
    document.getElementById('sign-out').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      pass.classList.add('hidden');
      showMessage('You have been signed out. Sign in through the Resonance member portal to view your pass.');
    });
    loadPass();
  </script>
</body>
</html>
