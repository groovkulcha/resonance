<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resonance</title>
  <style>
    body {
      margin: 0;
      font-family: Rajdhani, sans-serif;
      background: #0f1115;
      color: #f5f5f5;
      text-align: center;
      padding: 40px 20px;
    }

    .hero {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .flyer {
      display: block;
      width: 100%;
      max-width: 460px;
      height: auto;
      margin: 0 auto;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .join {
      width: 100%;
      max-width: 460px;
      margin: 30px auto 0;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: #171a20;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      text-align: left;
    }

    .join h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .join p {
      margin: 0 0 20px;
      color: #cfcfcf;
      line-height: 1.6;
    }

    .join-form {
      display: grid;
      gap: 12px;
    }

    .join-form label {
      color: #d8d8d8;
      font-size: 0.9rem;
    }

    .join-form input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: #0f1115;
      color: #f5f5f5;
      font: inherit;
    }

    .join-form button {
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      color: #111;
      background: #c9a15d;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

  </style>
</head>
<body>
  <section class="hero">
    <img
      class="flyer"
      src="./ResonanceFlyer_ShutUp.jpeg"
      alt="Resonance Shut Up and Dance event flyer"
      width="535"
      height="801"
    />
  </section>

  <section class="join" aria-labelledby="join-title">
    <h1 id="join-title">Pulse Rewards</h1>
    <p>Earn rewards for showing up, sharing the vibe, and staying connected.</p>
    <form class="join-form" action="join" method="get">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Start Earning</button>
    </form>
  </section>

  <script>
    document.querySelector('.join-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      window.sessionStorage.setItem('resonance.join.email', email);
      window.location.assign('join');
    });
  </script>
</body>
</html>
