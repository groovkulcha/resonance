<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Join Resonance Pulse Rewards">
  <title>Join Resonance Pulse Rewards</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b10; --panel: #171720; --text: #f8f7ff; --muted: #b8b6c8; --accent: #ff5c9a; --accent-2: #8e6cff; --error: #ff8a8a; --success: #8ff0b1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 15% 10%, rgba(255,92,154,.24), transparent 34%), radial-gradient(circle at 85% 90%, rgba(142,108,255,.24), transparent 38%), var(--bg); }
    main { width: min(100%, 560px); }
    .card { padding: clamp(24px, 6vw, 48px); border: 1px solid rgba(255,255,255,.13); border-radius: 24px; background: rgba(23,23,32,.92); box-shadow: 0 28px 90px rgba(0,0,0,.45); }
    .eyebrow { margin: 0 0 10px; color: #ffb2d0; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1; }
    .lede { margin: 18px 0 30px; color: var(--muted); line-height: 1.55; }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 8px; color: #f0eff8; font-weight: 700; font-size: .94rem; }
    input { width: 100%; min-height: 50px; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 12px 14px; color: var(--text); background: #101018; font: inherit; }
    input:focus { outline: 3px solid rgba(255,92,154,.35); border-color: var(--accent); }
    .checkbox { display: flex; align-items: flex-start; gap: 10px; color: var(--muted); font-weight: 500; line-height: 1.45; }
    .checkbox input { width: 18px; min-height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
    button { min-height: 52px; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; color: white; font: inherit; font-weight: 800; background: linear-gradient(110deg, var(--accent), var(--accent-2)); box-shadow: 0 12px 24px rgba(142,108,255,.25); }
    button:hover { filter: brightness(1.08); }
    button:disabled { cursor: wait; opacity: .65; }
    .status { display: none; margin: 20px 0 0; padding: 14px 16px; border-radius: 12px; line-height: 1.5; }
    .status.show { display: block; }
    .status.error { border: 1px solid rgba(255,138,138,.5); color: #ffd4d4; background: rgba(120,25,25,.25); }
    .status.success { border: 1px solid rgba(143,240,177,.5); color: #d4ffe2; background: rgba(30,110,60,.25); }
    .fine-print { margin: 20px 0 0; color: #9391a4; font-size: .82rem; line-height: 1.5; }
    .home { display: inline-block; margin-top: 22px; color: #fff; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="join-title">
      <p class="eyebrow">Resonance</p>
      <h1 id="join-title">Join Pulse Rewards</h1>
      <p class="lede">Create your member account to receive your digital pass and earn rewards at Resonance events.</p>

      <form id="join-form" novalidate>
        <label for="first-name">First name
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" maxlength="80" required>
        </label>

        <label for="email">Email address
          <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required>
        </label>

        <label for="password">Create a password
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>

        <label for="password-confirmation">Confirm password
          <input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required>
        </label>

        <label class="checkbox" for="marketing">
          <input id="marketing" name="marketing" type="checkbox">
          <span>Send me Resonance news, event updates, and rewards offers.</span>
        </label>

        <button id="submit-button" type="submit">Create my account</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <p class="fine-print">After signing up, check your inbox for an email confirmation. You must confirm your email before your member pass is activated.</p>
      <a class="home" href="index.html">Return to Resonance</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://bawttitvhoiwsjjxjmae.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_iygmt6kTFDohEVviH5QcbA_hxrLRDXR';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById('join-form');
    const submitButton = document.getElementById('submit-button');
    const status = document.getElementById('status');
    const savedEmail = window.sessionStorage.getItem('resonance.join.email');

    if (savedEmail) {
      document.getElementById('email').value = savedEmail;
      window.sessionStorage.removeItem('resonance.join.email');
    }

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status show ${type}`;
    }

    function friendlyError(error) {
      const message = error && error.message ? error.message : 'Something went wrong while creating your account.';
      if (/already registered|already exists/i.test(message)) return 'An account may already exist for that email. Try signing in or use a different email address.';
      if (/password/i.test(message)) return 'Choose a password with at least 8 characters.';
      if (/rate limit/i.test(message)) return 'Too many attempts were made. Please wait a few minutes and try again.';
      return message;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.className = 'status';

      if (!form.reportValidity()) return;

      const firstName = document.getElementById('first-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirmation = document.getElementById('password-confirmation').value;
      const marketing = document.getElementById('marketing').checked;

      if (!firstName) {
        showStatus('Please enter your first name.', 'error');
        return;
      }
      if (password !== passwordConfirmation) {
        showStatus('Your passwords do not match. Please try again.', 'error');
        document.getElementById('password-confirmation').focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Creating your account…';

      try {
        const redirectTo = new URL('pass.html', window.location.href).href;
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: redirectTo,
            data: {
              first_name: firstName,
              display_name: firstName,
              email_marketing_opt_in: marketing
            }
          }
        });

        if (error) throw error;

        form.hidden = true;
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          showStatus('If this email is eligible, you will receive next steps shortly. Please check your inbox.', 'success');
        } else {
          showStatus('Account created. Check your email and click the confirmation link to activate your member pass.', 'success');
        }
      } catch (error) {
        showStatus(friendlyError(error), 'error');
        submitButton.disabled = false;
        submitButton.textContent = 'Create my account';
      }
    });
  </script>
</body>
</html>
