<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Join Resonance</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0d0e; --card: #19191c; --ink: #f8f4ec; --muted: #bbb7ae; --accent: #f5c842; --line: #34343a; --danger: #ff8b8b; --success: #bdeaa5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #2c2110, transparent 38%), var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 430px); }
    .brand { margin: 0 0 12px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .2em; text-align: center; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.25rem, 10vw, 3.6rem); line-height: .92; letter-spacing: -.06em; text-align: center; }
    .intro { margin: 15px auto 26px; max-width: 33ch; color: var(--muted); line-height: 1.55; text-align: center; }
    .card { padding: 25px; border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(135deg, #242329, var(--card) 58%, #141416); box-shadow: 0 20px 60px #0008; }
    label { display: block; margin: 0 0 8px; color: var(--ink); font-size: .88rem; font-weight: 750; }
    input { width: 100%; margin: 0 0 18px; padding: 13px 14px; border: 1px solid #4b4a50; border-radius: 12px; outline: none; color: var(--ink); background: #111114; font: inherit; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #f5c84222; }
    button { width: 100%; padding: 14px 16px; border: 0; border-radius: 12px; color: #181307; background: var(--accent); font: inherit; font-weight: 850; cursor: pointer; }
    button:hover { filter: brightness(1.06); }
    button:disabled { cursor: wait; opacity: .65; }
    .notice { margin: 17px 2px 0; color: var(--muted); font-size: .9rem; line-height: 1.5; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
    .notice.success { color: var(--success); }
    .notice.error { color: var(--danger); }
    .diagnostic { margin: 12px 2px 0; padding: 11px; border: 1px solid #5a4242; border-radius: 10px; color: #ffd2d2; background: #2b1719; font: .78rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .diagnostic[hidden] { display: none; }
    .returning { margin: 20px 0 0; color: var(--muted); font-size: .9rem; text-align: center; }
    a { color: var(--accent); font-weight: 750; }
    .fine-print { margin: 24px auto 0; max-width: 38ch; color: #85817b; font-size: .78rem; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Resonance</p>
    <h1>Join the pulse.</h1>
    <p class="intro">Enter your details and we’ll email a secure sign-in link. Your permanent member pass is waiting on the other side.</p>
    <section class="card" aria-label="Member signup">
      <form id="join-form">
        <label for="name">First name</label>
        <input id="name" name="name" type="text" autocomplete="given-name" maxlength="80" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required>
        <button id="submit" type="submit">Email my sign-in link</button>
      </form>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <pre id="diagnostic" class="diagnostic" hidden aria-live="assertive"></pre>
      <p class="returning">Already a member? <a href="pass.html">View your pass</a></p>
    </section>
    <p class="fine-print">We use your email only to deliver your sign-in link and member pass. No password required.</p>
  </main>
  <script>
    const diagnostic = document.getElementById('diagnostic');
    const notice = document.getElementById('notice');
    const submit = document.getElementById('submit');
    const form = document.getElementById('join-form');
    const supabaseUrl = 'https://bawttitvhoiwsjjxjmae.supabase.co';
    const supabaseKey = 'sb_publishable_iygmt6kTFDohEVviH5QcbA_hxrLRDXR';
    let supabaseClient = null;

    function setNotice(text, kind = '') {
      notice.textContent = text;
      notice.className = `notice ${kind}`;
    }

    function showDiagnostic(label, error) {
      const detail = error instanceof Error ? `${error.name}: ${error.message}` : String(error || 'Unknown error');
      diagnostic.textContent = `${label}\n${detail}`;
      diagnostic.hidden = false;
      setNotice('The signup request could not be completed. Please send us the diagnostic message below.', 'error');
    }

    function loadSupabaseLibrary() {
      return new Promise((resolve, reject) => {
        if (window.supabase && typeof window.supabase.createClient === 'function') return resolve();
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js';
        script.async = true;
        script.onload = () => window.supabase && typeof window.supabase.createClient === 'function' ? resolve() : reject(new Error('The Supabase browser library loaded without createClient.'));
        script.onerror = () => reject(new Error('The Supabase browser library could not be downloaded. Check your network, content blockers, or retry later.'));
        document.head.appendChild(script);
      });
    }

    async function initialize() {
      try {
        await loadSupabaseLibrary();
        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        setNotice('');
      } catch (error) {
        showDiagnostic('Initialization failed:', error);
        submit.disabled = true;
      }
    }

    window.addEventListener('error', (event) => showDiagnostic('JavaScript error:', event.error || event.message));
    window.addEventListener('unhandledrejection', (event) => showDiagnostic('Unhandled request error:', event.reason));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      diagnostic.hidden = true;
      const displayName = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      if (!displayName || !email) {
        setNotice('Enter your first name and a valid email address.', 'error');
        return;
      }
      if (!supabaseClient) {
        showDiagnostic('Initialization failed:', new Error('The Supabase client is not ready.'));
        return;
      }
      submit.disabled = true;
      setNotice('Sending your secure sign-in link…');
      try {
        const redirectTo = new URL('pass-diagnostic.html', window.location.href).href;
        const { error } = await supabaseClient.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: redirectTo,
            shouldCreateUser: true,
            data: { display_name: displayName }
          }
        });
        if (error) throw error;
        form.reset();
        setNotice('Check your inbox for the secure sign-in link. After you open it, we’ll take you to your member pass.', 'success');
      } catch (error) {
        showDiagnostic('Supabase signup request failed:', error);
      } finally {
        submit.disabled = false;
      }
    });

    initialize();
  </script>
</body>
</html>
