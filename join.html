<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Join Resonance</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0d0e; --card: #19191c; --ink: #f8f4ec; --muted: #bbb7ae; --accent: #f5c842; --line: #34343a; --danger: #ff8b8b; --success: #bdeaa5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #2c2110, transparent 38%), var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 430px); }
    .brand { margin: 0 0 12px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .2em; text-align: center; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.25rem, 10vw, 3.6rem); line-height: .92; letter-spacing: -.06em; text-align: center; }
    .intro { margin: 15px auto 26px; max-width: 33ch; color: var(--muted); line-height: 1.55; text-align: center; }
    .card { padding: 25px; border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(135deg, #242329, var(--card) 58%, #141416); box-shadow: 0 20px 60px #0008; }
    label { display: block; margin: 0 0 8px; color: var(--ink); font-size: .88rem; font-weight: 750; }
    input { width: 100%; margin: 0 0 18px; padding: 13px 14px; border: 1px solid #4b4a50; border-radius: 12px; outline: none; color: var(--ink); background: #111114; font: inherit; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #f5c84222; }
    button { width: 100%; padding: 14px 16px; border: 0; border-radius: 12px; color: #181307; background: var(--accent); font: inherit; font-weight: 850; cursor: pointer; }
    button:hover { filter: brightness(1.06); }
    button:disabled { cursor: wait; opacity: .65; }
    .notice { margin: 17px 2px 0; color: var(--muted); font-size: .9rem; line-height: 1.5; text-align: center; }
    .notice.success { color: var(--success); }
    .notice.error { color: var(--danger); }
    .returning { margin: 20px 0 0; color: var(--muted); font-size: .9rem; text-align: center; }
    a { color: var(--accent); font-weight: 750; }
    .fine-print { margin: 24px auto 0; max-width: 38ch; color: #85817b; font-size: .78rem; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Resonance</p>
    <h1>Join the pulse.</h1>
    <p class="intro">Enter your details and we’ll email a secure sign-in link. Your permanent member pass is waiting on the other side.</p>
    <section class="card" aria-label="Member signup">
      <form id="join-form">
        <label for="name">First name</label>
        <input id="name" name="name" type="text" autocomplete="given-name" maxlength="80" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required>
        <button id="submit" type="submit">Email my sign-in link</button>
      </form>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <p class="returning">Already a member? <a href="pass.html">View your pass</a></p>
    </section>
    <p class="fine-print">We use your email only to deliver your sign-in link and member pass. No password required.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://bawttitvhoiwsjjxjmae.supabase.co';
    const supabaseKey = 'sb_publishable_iygmt6kTFDohEVviH5QcbA_hxrLRDXR';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    const form = document.getElementById('join-form');
    const submit = document.getElementById('submit');
    const notice = document.getElementById('notice');
    function setNotice(text, kind = '') { notice.textContent = text; notice.className = `notice ${kind}`; }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const displayName = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      if (!displayName || !email) return;
      submit.disabled = true;
      setNotice('Sending your secure sign-in link…');
      const redirectTo = new URL('pass.html', window.location.href).href;
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: redirectTo, shouldCreateUser: true, data: { display_name: displayName } }
      });
      submit.disabled = false;
      if (error) { setNotice(error.message || 'We couldn’t send the sign-in link. Please try again.', 'error'); return; }
      form.reset();
      setNotice('Check your inbox for the secure sign-in link. After you open it, we’ll take you to your member pass.', 'success');
    });
  </script>
</body>
</html>
